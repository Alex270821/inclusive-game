<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Le Grimoire de Léo & Luna">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a1170"/>
      <stop offset="55%" stop-color="#1e0a4a"/>
      <stop offset="100%" stop-color="#160630"/>
    </radialGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Fond -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Étoiles -->
  <g fill="#c4b5fd">
    <circle cx="96"  cy="110" r="5"/>
    <circle cx="150" cy="70"  r="3"/>
    <circle cx="410" cy="96"  r="6"/>
    <circle cx="450" cy="150" r="3"/>
    <circle cx="70"  cy="210" r="3"/>
    <circle cx="440" cy="250" r="4"/>
  </g>
  <g fill="#f9a8d4">
    <circle cx="120" cy="160" r="3"/>
    <circle cx="390" cy="190" r="3"/>
  </g>

  <!-- Lune en croissant -->
  <path d="M408 188a78 78 0 1 1-78-92 64 64 0 0 0 78 92z" fill="url(#moon)"/>

  <!-- Lapin (Léo & Luna) -->
  <g transform="translate(256 300)">
    <!-- Oreilles -->
    <ellipse cx="-34" cy="-92" rx="20" ry="56" fill="#ede9fe" transform="rotate(-12 -34 -92)"/>
    <ellipse cx="34"  cy="-92" rx="20" ry="56" fill="#ede9fe" transform="rotate(12 34 -92)"/>
    <ellipse cx="-34" cy="-92" rx="9" ry="38" fill="#f9a8d4" transform="rotate(-12 -34 -92)"/>
    <ellipse cx="34"  cy="-92" rx="9" ry="38" fill="#a78bfa" transform="rotate(12 34 -92)"/>
    <!-- Tête -->
    <circle cx="0" cy="-8" r="74" fill="#f5f3ff"/>
    <!-- Yeux -->
    <circle cx="-26" cy="-14" r="9" fill="#1e1b4b"/>
    <circle cx="26"  cy="-14" r="9" fill="#1e1b4b"/>
    <circle cx="-23" cy="-17" r="3" fill="#fff"/>
    <circle cx="29"  cy="-17" r="3" fill="#fff"/>
    <!-- Museau -->
    <ellipse cx="0" cy="8" rx="7" ry="5" fill="#f472b6"/>
    <!-- Joues -->
    <circle cx="-44" cy="6" r="11" fill="#f9a8d4" opacity="0.6"/>
    <circle cx="44"  cy="6" r="11" fill="#a78bfa" opacity="0.6"/>
  </g>

  <!-- Symboles maths -->
  <g fill="#fcd34d" font-family="Georgia, serif" font-weight="bold" opacity="0.9">
    <text x="86"  cy="0" y="410" font-size="58">+</text>
    <text x="386" y="410" font-size="58">=</text>
  </g>
  <g fill="#6ee7b7" font-family="Georgia, serif" font-weight="bold" opacity="0.85">
    <text x="170" y="442" font-size="44">3</text>
    <text x="312" y="442" font-size="44">7</text>
  </g>
</svg>
